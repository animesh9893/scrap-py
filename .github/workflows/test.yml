name: Tests

# pytest on every pull request and push to main: the LinkedIn source on saved pages, the planner, and db.py against
# a throwaway Postgres (never Supabase). No secrets are used.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: python -m pytest -q tests
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
          DATABASE_SSL: 'false'
