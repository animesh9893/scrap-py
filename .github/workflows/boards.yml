name: Ashby jobs

# Runs boards.py: reads the Ashby job boards of the companies in Supabase (data/ats-companies.csv, imported into the
# companies table) and saves their tech jobs (source 'ashby') for the site's Ashby section. Every 2 hours in
# proj-berry/scrap-py, each run reading the boards not read in the last 6 hours (about 3,400 boards, a few minutes
# with 6 at a time). On demand: one board (board: openai) or every due board.
on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Only this board (jobs.ashbyhq.com/<board>), e.g. openai. Empty = every due board'
        default: ''
      max_boards:
        description: 'At most this many boards (0 = all due)'
        default: '0'
      save:
        description: 'Save the jobs to Supabase'
        type: boolean
        default: true
  schedule:
    - cron: '33 */2 * * *'

concurrency:
  group: boards
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  boards:
    if: github.event_name != 'schedule' || github.repository == 'proj-berry/scrap-py'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Read the boards
        run: python boards.py
        env:
          BOARD: ${{ inputs.board }}
          MAX_BOARDS: ${{ inputs.max_boards }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && !inputs.save }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
