name: Scrape jobs

# Runs scrape.py (LinkedIn) and uploads what it writes (jobs.json, jobs.csv, jobs.md, report.html) as the run's
# artifact "jobs-<run number>". No schedule: start it with the Run workflow button or the API.
on:
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Search term (LinkedIn keywords; add "remote" for remote jobs)'
        default: 'software engineer'
      location:
        description: 'Location'
        default: 'Bengaluru'
      hours_old:
        description: 'Only jobs posted in the last N hours (0 = any time)'
        default: '24'
      results:
        description: 'Jobs to keep, after filtering'
        default: '30'
      job_type:
        description: 'Employment type'
        type: choice
        options: [any, full-time, part-time, contract, temporary, internship, volunteer]
        default: any
      experience:
        description: 'Seniority, comma-separated: internship, entry level, associate, mid-senior level, director, executive'
        default: ''
      exclude:
        description: 'Skip jobs with any of these words in the title, comma-separated (e.g. senior, lead)'
        default: ''
      company_ids:
        description: 'Only these LinkedIn company ids, comma-separated (the number in the company search URL)'
        default: ''
      easy_apply:
        description: 'Easy Apply jobs only'
        type: boolean
        default: false
      sort:
        description: 'Order'
        type: choice
        options: [recent, relevant]
        default: recent
  push:
    branches: [main]
    paths: ['scrape.py', 'requirements.txt', '.github/workflows/scrape.yml']

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Scrape
        run: python scrape.py
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
          LOCATION: ${{ inputs.location }}
          HOURS_OLD: ${{ inputs.hours_old }}
          RESULTS: ${{ inputs.results }}
          JOB_TYPE: ${{ inputs.job_type }}
          EXPERIENCE: ${{ inputs.experience }}
          EXCLUDE: ${{ inputs.exclude }}
          COMPANY_IDS: ${{ inputs.company_ids }}
          EASY_APPLY: ${{ inputs.easy_apply }}
          SORT: ${{ inputs.sort }}
          PROXIES: ${{ secrets.PROXIES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
