name: Scrape jobs

# Runs scrape.py and uploads everything it writes (CSV + JSON per source, combined file, summary) as the
# run's artifact "jobs-<run number>". No schedule: start it with the Run workflow button or the API.
on:
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Search term'
        default: 'software engineer'
      location:
        description: 'Location'
        default: 'Bengaluru'
      sites:
        description: 'Job boards, comma-separated (naukri, indeed, linkedin, glassdoor, google, zip_recruiter)'
        default: 'naukri,indeed,linkedin,glassdoor'
      results:
        description: 'Results per site'
        default: '30'
      hours_old:
        description: 'Only jobs posted in the last N hours'
        default: '24'
      companies:
        description: 'ATS companies, comma-separated: ats:slug or bare slug (auto-detect)'
        default: 'greenhouse:gitlab,lever:spotify,ashby:linear,stripe'
      run_boards:
        description: 'Scrape job boards'
        type: boolean
        default: true
      run_ats:
        description: 'Fetch ATS companies'
        type: boolean
        default: true
      fetch_desc:
        description: 'Full job descriptions (one extra request per LinkedIn / Naukri / Glassdoor job; Indeed always has them)'
        type: boolean
        default: true
  push:
    branches: [main]
    paths: ['scrape.py', 'requirements.txt', '.github/workflows/scrape.yml']

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -U -r requirements.txt
      - name: Scrape
        run: python scrape.py
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
          LOCATION: ${{ inputs.location }}
          SITES: ${{ inputs.sites }}
          RESULTS: ${{ inputs.results }}
          HOURS_OLD: ${{ inputs.hours_old }}
          COMPANIES: ${{ inputs.companies }}
          RUN_BOARDS: ${{ inputs.run_boards }}
          RUN_ATS: ${{ inputs.run_ats }}
          FETCH_DESC: ${{ inputs.fetch_desc }}
          PROXIES: ${{ secrets.PROXIES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: 30
