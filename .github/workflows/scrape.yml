name: Scrape jobs

# Runs scrape.py (LinkedIn) and uploads what it writes (jobs.json, jobs.csv, jobs.md, report.html) as the run's
# artifact "jobs-<run number>". Runs every 10 minutes on GitHub's schedule (looking back 1 hour) in proj-berry/scrap-py,
# and on demand with the Run workflow button or the API.
on:
  workflow_dispatch:
    inputs:
      search_term:
        description: 'Search term (LinkedIn keywords; add "remote" for remote jobs)'
        default: 'software engineer'
      location:
        description: 'Location'
        default: 'Bengaluru'
      hours_old:
        description: 'Only jobs posted in the last N hours (0 = any time)'
        default: '24'
      results:
        description: 'Jobs to keep, after filtering'
        default: '30'
      job_type:
        description: 'Employment type'
        type: choice
        options: [any, full-time, part-time, contract, temporary, internship, volunteer]
        default: any
      experience:
        description: 'Seniority, comma-separated: internship, entry level, associate, mid-senior level, director, executive'
        default: ''
      exclude:
        description: 'Skip jobs with any of these words in the title, comma-separated (e.g. senior, lead)'
        default: ''
      company_ids:
        description: 'Only these LinkedIn company ids, comma-separated (the number in the company search URL)'
        default: ''
      easy_apply:
        description: 'Easy Apply jobs only'
        type: boolean
        default: false
      sort:
        description: 'Order'
        type: choice
        options: [recent, relevant]
        default: recent
      category:
        description: 'Category for the jobs found (frontend, backend, fullstack, mobile); empty = from the keyword or title'
        default: ''
      save:
        description: 'Save the jobs to Supabase (needs the DATABASE_URL secret)'
        type: boolean
        default: true
  schedule:
    - cron: '*/10 * * * *'      # every 10 minutes (UTC); GitHub may start scheduled runs a few minutes late
  push:
    branches: [main]
    paths: ['scrape.py', 'db.py', 'schema.sql', 'requirements.txt', '.github/workflows/scrape.yml']

concurrency:
  group: scrape
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    # The schedule scrapes only in proj-berry/scrap-py, the main repo. Changes are pushed to animesh9893/scrap-py
    # (its upstream), where scheduled runs are skipped; manual and push runs work in both.
    if: github.event_name != 'schedule' || github.repository == 'proj-berry/scrap-py'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Scrape
        run: python scrape.py
        env:
          SEARCH_TERM: ${{ inputs.search_term }}
          LOCATION: ${{ inputs.location }}
          HOURS_OLD: ${{ github.event_name == 'schedule' && '1' || inputs.hours_old }}   # scheduled: the last hour
          RESULTS: ${{ inputs.results }}
          JOB_TYPE: ${{ inputs.job_type }}
          EXPERIENCE: ${{ inputs.experience }}
          EXCLUDE: ${{ inputs.exclude }}
          COMPANY_IDS: ${{ inputs.company_ids }}
          EASY_APPLY: ${{ inputs.easy_apply }}
          SORT: ${{ inputs.sort }}
          CATEGORY: ${{ inputs.category }}
          DRY_RUN: ${{ github.event_name == 'push' || inputs.save == false }}   # a push only tests the scraper
          PROXIES: ${{ secrets.PROXIES }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jobs-${{ github.run_number }}
          path: out/
          if-no-files-found: warn
          retention-days: ${{ github.event_name == 'schedule' && 7 || 30 }}   # 144 scheduled runs a day
